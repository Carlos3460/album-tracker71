<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Album-tracker</title>
</head>
<body>
    <div class="container">
  <div class="row">
    <div class="col-md-2">
        <form id="album-form">
      <div class="form-group">
        <label for="Title">Title</label>
        <input type="text" name="Title" class="form-control" id="Title" aria-describedby="Title" placeholder="Enter Title">
      </div>
      <div class="form-group">
        <label for="Artist">Artist</label>
        <input type="text" name="Artist" class="form-control" id="Artist" placeholder="Enter Artist">
      </div>
      <div class="form-group">
        <label for="ReleaseYear">Release Year</label>
        <input type="number" name="ReleaseYear" class="form-control" id="ReleaseYear" placeholder="Enter Release Year" min="1900" max="2026">
      </div>
      <div class="form-group">
        <label for="Genre">Genre</label>
        <input type="text" name="Genre" class="form-control" id="Genre" placeholder="Enter Genre">
      </div>
      <div class="form-group">
        <label for="Raiting">Raiting</label>
        <input type="number" name="Raiting" class="form-control" id="Raiting" placeholder="Enter Raiting" min="1" max="10">
      </div>
       <div class="form-check">
    <input type="checkbox" name="Listened" class="form-check-input" id="Listened">
    <label class="Listened for="Listened">Listened</label>
  </div>
      <div class= "d-flex justify-content-center">
          <button class="btn btn-primary" type="submit">Enviar</button>
      </div>
      </form>
    
    </div>
    <div class="col-md-8">
      <div class="container">
  <div class="row">
  
          <main id="album-container">
          </main>
  </div>
</div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
